spec_version: 1
name: speculate_forge
type: space
runtime: fastapi
app: server.app:app
port: 8000
description: >
  Hardware-verified RL environment for autonomous speculative decoding
  optimization. Multi-agent system (Planner/Scheduler/Evaluator/Optimizer)
  explores configurations in parallel on real A100/H100/B200 GPUs via Modal.
  The current repository stage is a Phase E multitask foundation: the A100
  path is live and quality-gated, while Tasks 2-4 are planner-ready and
  intentionally staged behind the lower-tier rollout.
author: kshitiz-yadav
license: MIT

tasks:
  - id: task1
    name: "Basic Speculation on A100"
    gpu: "A100-80GB"
    max_steps: 8
    reward_range: [0.0, 1.2]
    target_speedup: 1.5
    frontier_success_rate: 0.80
  - id: task2
    name: "FP8 Regime on H100"
    gpu: "H100-80GB"
    max_steps: 8
    reward_range: [0.0, 1.2]
    target_speedup: 2.0
    frontier_success_rate: 0.40
  - id: task3
    name: "Tree Speculation on H100"
    gpu: "H100-80GB"
    max_steps: 10
    reward_range: [0.0, 1.2]
    target_speedup: 2.5
    frontier_success_rate: 0.20
  - id: task4
    name: "NVFP4 Frontier on B200"
    gpu: "B200-180GB"
    max_steps: 10
    reward_range: [0.0, 1.2]
    target_speedup: 3.0
    frontier_success_rate: 0.05

action_space:
  type: structured
  description: "Agent proposes N candidate configs; scheduler runs them in parallel"
  fields:
    - candidate_configs (List[SpeculateConfig], 1-3 items)
    - phase (exploration | exploitation)
    - reasoning (string)
    - hypothesis (string)

observation_space:
  trial_results: "Per-config GPU benchmark results"
  best_config: "Winning config this iteration"
  trajectory: "Best reward per iteration so far"
  evaluator_feedback: "Bottleneck ID and next action advice"
  baseline_throughput: "Vanilla decoding tok/s"
  cost_so_far_usd: "Modal GPU cost this episode"

reward_breakdown:
  throughput: "0.00-0.60 (speedup x quality)"
  improvement_bonus: "+0.10 (new trajectory best)"
  exceed_target: "1.0 + 0.1*log(speedup/target)"
  quality_gate: "0.0 if quality < 95%"
  anti_cheat: "0.0 on physics or exploit violations"

interaction_modes:
  agent_auto: "Autonomous multi-agent parallel exploration"
  manual: "Judge inputs custom config, runs on real GPU in ~15s"
  current_rollout: "Task 1 on A100 is the live hosted path; Tasks 2-4 remain staged behind it"

training:
  framework: "HF TRL GRPO"
  model: "Qwen/Qwen2.5-0.5B-Instruct"
  precision: "bf16=True (BF16 paper fix - matches Modal inference)"
  tracking: "Trackio (HF Spaces dashboard)"
  rollout: "Start logging and training on Task 1 immediately after the hosted A100 path is stable; do not wait for Tasks 2-4."

server:
  port: 8000
  endpoints:
    - GET /
    - GET /health
    - GET /info
    - GET /schema
    - GET /metadata
    - POST /mcp
    - POST /reset
    - POST /step
    - POST /manual_step
    - GET /state
    - WS /ws
