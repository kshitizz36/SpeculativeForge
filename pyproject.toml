[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-speculate-forge"
version = "0.1.0"
description = "Hardware-verified RL environment for speculative decoding optimization"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "fastapi>=0.110,<1",
    "openai>=2.7.2,<3",
    "pydantic>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "uvicorn[standard]>=0.29,<1",
    "modal>=0.65.0",
    "trackio>=0.15.0",
    "aiohttp>=3.9.0",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
training = [
    "trl>=0.7.0",
    "transformers>=4.45.0",
    "unsloth",
    "datasets",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["speculate_forge*", "server*", "training*", "graders*"]
